<section id="about" class="about">
  <div class="about-image">
    <img [src]="portraitImage"
         alt="The Fairview Community Center">
  </div>
  <div class="about-copy">
    <p class="eyebrow">{{ content.eyebrow }}</p>
    <h2>{{ content.heading }} <em>{{ content.headingEmphasis }}</em></h2>
    <p *ngFor="let paragraph of bodyParagraphs">{{ paragraph }}</p>
    <button class="underlined" (click)="onLearnMoreClick()">{{ content.ctaLabel }} <span>↗</span></button>
  </div>
</section>

<section class="about-features" *ngIf="features.length">
  <h3 class="about-features-heading">Features:</h3>
  <div class="about-features-grid">
    <article class="about-feature" *ngFor="let feature of features">
      <img *ngIf="featureImage(feature.image) as image" [src]="image" [alt]="feature.title">
      <h4>{{ feature.title }}</h4>
      <p>{{ feature.description }}</p>
    </article>
  </div>
</section>

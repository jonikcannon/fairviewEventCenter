<section id="about" class="about">
  <div class="about-image">
    <img [src]="portraitImage"
         alt="The Fairview Community Center">
  </div>
  <div class="about-copy">
    <p class="eyebrow" [ngStyle]="style('about.eyebrow')">{{ content.eyebrow }}</p>
    <h2 [ngStyle]="style('about.heading')">{{ content.heading }} <em>{{ content.headingEmphasis }}</em></h2>
    <p *ngFor="let paragraph of bodyParagraphs" [ngStyle]="style('about.body')">{{ paragraph }}</p>
    <button class="underlined" [ngStyle]="style('about.ctaLabel')" (click)="onLearnMoreClick()">{{ content.ctaLabel }} <span>↗</span></button>
    <button class="underlined rates-link" (click)="onRatesClick()">View rate schedule <span>↗</span></button>
    <button class="underlined rates-link" (click)="onBookingClick()">Book now <span>↗</span></button>
  </div>
</section>

<section class="about-features" *ngIf="features.length">
  <h3 class="about-features-heading">Features:</h3>
  <div class="about-features-grid">
    <article class="about-feature" *ngFor="let feature of features">
      <img *ngIf="featureImage(feature.image) as image" [src]="image" [alt]="feature.title" class="about-feature-image" role="button" tabindex="0" [attr.aria-label]="'View ' + feature.title + ' photo'" (click)="onFeatureClick(feature)" (keydown.enter)="onFeatureClick(feature)" (keydown.space)="$event.preventDefault(); onFeatureClick(feature)">
      <h4 [ngStyle]="style('about.featureTitle')">{{ feature.title }}<span class="about-feature-price" [ngStyle]="style('about.featurePrice')" *ngIf="feature.price">{{ feature.price }}</span></h4>
      <p [ngStyle]="style('about.featureDescription')">{{ feature.description }}</p>
      <span class="about-feature-included" *ngIf="!feature.price">Included</span>
    </article>
  </div>
</section>

name: Deploy production

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to the Ubuntu server
    # The server lives on a private LAN (192.168.4.55), which GitHub's hosted
    # runners cannot route to. A self-hosted runner on the box itself connects
    # OUTBOUND to GitHub instead, so nothing has to be exposed to the internet
    # and no SSH key ever needs to live in GitHub.
    # Install it with scripts/deploy/setup-runner.sh.
    runs-on: [self-hosted, linux, fairview]
    timeout-minutes: 20

    steps:
      # No actions/checkout: the deploy script pulls into the live app directory
      # itself, which stays the single source of truth on the server. Checking
      # out into the runner workspace would create a second copy that could
      # drift from what is actually being served.
      - name: Deploy
        env:
          APP_DIR: ${{ vars.DEPLOY_APP_DIR || '/var/www/fairview/app' }}
        run: |
          set -euo pipefail
          test -d "$APP_DIR" || { echo "App directory not found: $APP_DIR"; exit 1; }
          APP_DIR="$APP_DIR" DEPLOY_FRONTEND=true RELOAD_NGINX=true \
            bash "$APP_DIR/scripts/deploy/deploy.sh"

      # A deploy that leaves the API down is worse than one that fails loudly,
      # so prove the service actually answers before calling this a success.
      - name: Verify the API is serving
        run: |
          set -euo pipefail
          for attempt in $(seq 1 15); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/products || true)
            if [ "$code" = "200" ]; then
              echo "API healthy (HTTP $code) after ${attempt} attempt(s)."
              exit 0
            fi
            echo "  attempt ${attempt}: HTTP ${code:-no response}"
            sleep 2
          done
          echo "API did not return 200 after the deploy."
          pm2 logs fairviewApi --lines 40 --nostream || true
          exit 1

      - name: Verify the site is being served
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1/ || true)
          if [ "$code" = "200" ] || [ "$code" = "301" ] || [ "$code" = "302" ]; then
            echo "Nginx serving the site (HTTP $code)."
          else
            echo "Nginx returned HTTP ${code:-no response}."
            exit 1
          fi

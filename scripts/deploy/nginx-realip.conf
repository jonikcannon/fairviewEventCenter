# Installed to /etc/nginx/conf.d/fairview-realip.conf by bootstrap-vps.sh.
# `map` is only valid in the http context, which is why this cannot live in
# the site config alongside everything else.
#
# Behind Cloudflare Tunnel every request reaches nginx from cloudflared on
# 127.0.0.1, so $remote_addr is useless for identifying a visitor -- without
# this, express-rate-limit buckets the entire internet into one counter.
#
# CF-Connecting-IP is the visitor's real address. Cloudflare overwrites it on
# every request, so a client cannot forge it, and nothing can reach this nginx
# except through the tunnel. It is absent on direct LAN access, where
# $remote_addr is already the right answer.
map $http_cf_connecting_ip $fairview_client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

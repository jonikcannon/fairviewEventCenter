# Security headers for the Fairview site. Installed to
# /etc/nginx/snippets/fairview-security.conf by bootstrap-vps.sh.
#
# nginx does NOT inherit add_header into a location that declares an add_header
# of its own, so this snippet has to be included in each such location as well
# as at server level. Forgetting that is how /uploads/ silently loses nosniff.

# The site is HTTPS-only at the Cloudflare edge. includeSubDomains covers a
# future media.<domain>; drop it if any subdomain must serve plain HTTP.
# No `preload` -- that one is effectively irreversible.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

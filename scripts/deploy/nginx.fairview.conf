server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    root __APP_DIST__;
    index index.html;

    client_max_body_size 70m;

    # Behind Cloudflare Tunnel, TLS terminates at the edge and cloudflared
    # forwards the visitor's original scheme, so $scheme is always "http" here
    # and cannot be used to detect it. Anything that arrived over plain HTTP is
    # bounced to HTTPS before it reaches the app. On a direct-to-internet host
    # the header is absent, so this is inert and certbot's own --redirect does
    # the job instead. `return` inside `if` is safe in the server context.
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    include snippets/fairview-security.conf;

    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $fairview_client_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /uploads/ {
        alias __UPLOADS_DIR__/;
        autoindex off;
        expires 7d;
        add_header Cache-Control "public";
        include snippets/fairview-security.conf;
    }

    # The manifest is rewritten by category moves and is never in the bucket,
    # so it is always served from disk -- and must be matched before the
    # gallery rule below.
    location = /assets/gallery/gallery-manifest.json {
        alias __GALLERY_DIR__/gallery-manifest.json;
        add_header Cache-Control "no-cache";
        include snippets/fairview-security.conf;
    }

    # Gallery media. bootstrap-vps.sh replaces this block with a redirect to the
    # R2 bucket when MEDIA_CDN_URL is configured, so media bytes never leave the
    # VPS; templates hard-code a few gallery paths that bypass the manifest.
    location /assets/gallery/ {
        __GALLERY_LOCATION_BODY__
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
